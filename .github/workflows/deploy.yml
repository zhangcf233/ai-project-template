name: staging-deploy

on:
  push:
    branches: ["develop"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/ai-project-template
          IMAGE_TAG=${{ github.sha }}
          docker build -f docker/nginx/Dockerfile -t ${IMAGE_REPO}:${IMAGE_TAG} .
          docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - name: Deploy to staging server by deploy user
        env:
          SERVERS: ${{ secrets.SERVERS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          IFS=',' read -r -a SERVER_ARRAY <<< "$SERVERS"
          for SERVER in "${SERVER_ARRAY[@]}"; do
            SERVER=$(echo "$SERVER" | xargs)
            [ -z "$SERVER" ] && continue
            ssh -o StrictHostKeyChecking=accept-new -i "$KEY_FILE" deploy@"$SERVER" \
              "cd /opt/apps/${{ github.event.repository.name }} && bash deploy/remote_apply.sh staging /opt/apps/${{ github.event.repository.name }} ghcr.io/${{ github.repository_owner }}/ai-project-template ${{ github.sha }} 8080 ${{ github.actor }} '${{ secrets.GITHUB_TOKEN }}'"
          done
          rm -f "$KEY_FILE"
