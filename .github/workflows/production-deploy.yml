name: production-deploy

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/ai-project-template
          IMAGE_TAG=${{ github.sha }}
          docker build -f docker/nginx/Dockerfile -t ${IMAGE_REPO}:${IMAGE_TAG} .
          docker push ${IMAGE_REPO}:${IMAGE_TAG}

      - name: Deploy production
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          mkdir -p .runtime
          echo "$PRODUCTION_ENV_FILE" > .runtime/production.env
          echo "IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/ai-project-template" >> .runtime/production.env
          echo "IMAGE_TAG=${{ github.sha }}" >> .runtime/production.env
          bash deploy/deploy.sh production .runtime/production.env docker-compose.prod.yml
